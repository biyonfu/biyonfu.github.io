<!DOCTYPE html>
<html lang="zh-CN">

<!-- Generated by DeepSeek AI -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人网站 - Github IO</title>
	<link rel="icon" href="/system/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="system/style1.css">
    <link rel="stylesheet" href="system/btn.css">
</head>
<body>
    <div class="glass-panel">
        <!-- 导航栏：左侧头像+名字，右侧标签按钮 -->
        <nav class="tabs">
            <div class="nav-left">
                <div class="avatar" id="avatar-btn">avatar icon placeholder</div>
                <span class="username">搞电脑的查拉</span>
				<span class="usernamesubtitle">· 个人网站</span>
            </div>
            <div class="nav-right">
                <button class="tab-btn" data-page="aboutme">📄 关于我</button>
                <button class="tab-btn" data-page="mystuff">🛠 我的东西</button>
                <button class="tab-btn" data-page="social">📫 找到我</button>
                <button class="tab-btn" data-page="blogview">📝 我的文章</button>
                <button class="tab-btn" data-page="comment">💬 评论区</button>
            </div>
        </nav>

        <!-- iframe 内容区域 -->
        <iframe id="content-frame" src="content/1st-ux.html" frameborder="0"></iframe>
    </div>

    <script>
        const frame = document.getElementById('content-frame');
        const buttons = document.querySelectorAll('.tab-btn');
        const avatar = document.getElementById('avatar-btn');

        // 切换标签页
        function switchTab(page) {
            // 移除所有激活状态
            buttons.forEach(b => b.classList.remove('active'));
            // 激活对应按钮（如果存在）
            const targetBtn = document.querySelector(`.tab-btn[data-page="${page}"]`);
            if (targetBtn) targetBtn.classList.add('active');
            // 切换 iframe
            frame.src = 'content/' + page + '.html';
        }

        // 为按钮绑定点击事件
        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                const page = this.dataset.page;
                switchTab(page);
            });
        });

        // 点击头像：若当前在欢迎页，则进入“关于我”；否则也可切换（统一进入关于我）
        avatar.addEventListener('click', function() {
            // 如果当前显示的是 welcome，则切换到 about
            if (frame.src.includes('content/1st-ux.html')) {
                switchTab('aboutme');
            } else {
                // 也可以允许直接跳转，看个人喜好，我们统一跳转到 about
                switchTab('1st-ux');
            }
        });

// ----- 设置头像图片 -----
document.addEventListener('DOMContentLoaded', function() {
    var avatar = document.getElementById('avatar-btn');
    if (avatar) {
        avatar.style.backgroundImage = 'url("../content/avatarico.png")';
        avatar.style.backgroundSize = 'cover';
        avatar.style.backgroundPosition = 'center';
        avatar.textContent = ''; // 清除文字 "你"
    }
});

    </script>
</body>
</html>
